<!DOCTYPE html>
<html >
<head>
    <link rel="stylesheet" href="formulaire.css">
</head>
<body>
    <br><br>
   <form>
   <h1>Formulaire</h1> 
    <hr>
    <h3>votre nom et prenom</h3><br><br>
    <input type="text" name="nom" size="20"><br><br>
    <h3>Quelle est votre langue</h3><br><br>
    <input type="checkbox" name="checkbox1" >Anglais<br>
    <input type="checkbox" name="checkbox2" >Francais<br>
    <input type="checkbox" name="checkbox3" >Autre<br>
    <h3>Homme ou Femme ?</h3><br>
    <input type="radio" name="Sexe_Homme" value="homme" > Homme<br>
    <input type="radio" name="Sexe_femme" value="femme"> Femme<br><br>
    <h3>De quel continent ête vous</h3><br><br>
    <select name="continent">
        <option> Afrique </option>
        <option> Amerique</option>
        <option> Asia </option>

    </select><br><br>
    <h3>Donnez vos impressions:</h3> <br><br>
    <textarea name="impressions" rows="5" cols="30"></textarea><br><br>
    <input type="submit" value="Envoyer" size="40"><br><br>
    <input type="reset" value="Effacer" size="40">
   </form> 
</body>
</html>
